# ~/.config/tmux/nav-history.conf
# Browser-style back/forward through the windows you visit, across sessions.
# Logic: scripts/nav-history.sh. Sourced in tmux.conf after TPM, so continuum's
# restore at startup doesn't fill the history.

# Record every move. Hooks run the script in the background so switching
# windows never waits on it. Index [42] is ours, so we never overwrite a hook
# another plugin set on the same event, and re-sourcing replaces instead of
# stacking duplicates.
set-hook -g 'client-session-changed[42]' 'run-shell -b "~/.config/tmux/scripts/nav-history.sh record"'
set-hook -g 'session-window-changed[42]' 'run-shell -b "~/.config/tmux/scripts/nav-history.sh record"'

# Note where you are right now, so the first move after a reload can be undone.
run-shell -b "~/.config/tmux/scripts/nav-history.sh record"

# prefix Left / Right replace tmux's defaults, which only duplicate h / l.
bind -N "History: back to the previous place" Left run-shell "~/.config/tmux/scripts/nav-history.sh back '#{client_name}'"
bind -N "History: forward again"              Right run-shell "~/.config/tmux/scripts/nav-history.sh forward '#{client_name}'"
