# ~/.config/tmux/agent-attention.conf
# A "● N" dot at the right of the status bar when opencode agents are waiting for
# you, and prefix Up (Cmd+Up) to jump to the one waiting longest. Logic:
# scripts/agent-attention.sh. The opencode side, which reports busy/waiting:
# ~/.config/opencode/plugins/agent-attention.ts.
# Sourced after plugins.conf: it replaces the status-right that file blanks.

# Looking at a waiting agent, however you got there (Cmd+Up, Ctrl+1, Cmd+O, a
# split), marks it seen. Index [43] is ours; re-sourcing replaces, never stacks.
set-hook -g 'client-session-changed[43]' 'run-shell -b "~/.config/tmux/scripts/agent-attention.sh seen"'
set-hook -g 'session-window-changed[43]' 'run-shell -b "~/.config/tmux/scripts/agent-attention.sh seen"'
set-hook -g 'window-pane-changed[43]' 'run-shell -b "~/.config/tmux/scripts/agent-attention.sh seen"'

# The dot. tmux counts at every redraw: one x per pane, across all sessions, that
# is waiting and still runs opencode. Nothing at all when the count is zero.
set -g @agent_dots '#{S:#{W:#{P:#{?#{&&:#{==:#{@agent_state},waiting},#{==:#{pane_current_command},opencode}},x,}}}}'
set -g status-right '#{?#{E:@agent_dots},#[fg=#e0af68]● #{n:#{E:@agent_dots}} #[default],}'

# prefix Up replaces tmux's default, which only duplicates k.
bind -N "Agents: go to the one waiting longest" Up run-shell "~/.config/tmux/scripts/agent-attention.sh next '#{client_name}'"
