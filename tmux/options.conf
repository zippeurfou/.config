# ~/.config/tmux/options.conf — server/session behaviour
# Sourced by tmux.conf

# --- Terminal & truecolor (iTerm2) ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on                         # forward richer key combos (C-S-x, etc.) to nvim
set -as terminal-features ",xterm-256color:extkeys"

# --- General behaviour ---
set -g status-position top       # status bar at the TOP
set -g mouse on                 # click / scroll / resize with the mouse
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
set -g renumber-windows on      # keep window numbers gapless
set -g automatic-rename off     # your window names stick (don't auto-rename)
set -g allow-rename off         # apps can't rename your windows via escape codes
set -g history-limit 100000     # generous scrollback
set -g display-time 2000        # status messages linger 2s
set -g status-interval 5        # refresh status bar every 5s
set -g focus-events on          # let nvim see focus (autoread, etc.)
set -sg escape-time 10          # near-zero esc lag for nvim
set -g set-clipboard on         # OSC52 -> iTerm2 system clipboard
set -g allow-passthrough on     # pass image protocols through tmux (yazi previews, etc.)
set -g detach-on-destroy off    # killing the current session hops to another, not out to a shell

# --- Hooks ---
# Must stay in this file, which tmux.conf sources before TPM: @continuum-restore
# spawns sessions at plugin-load time and would miss a hook registered later.
#
# A new session's first window is named after its command, so with
# automatic-rename off it reads "zsh" forever. Rewrite that one literal to
# "term". The guard is a string match, not -n awareness: anything already named
# (new-window.sh's prompt, resurrect's saved names) is left alone, and so is any
# other shell -- switch default-shell to fish and this silently stops matching.
# Blanket -g, so it also covers sessionx, floax and resurrect, not just
# 55-tmux.zsh / sessionizer.sh / session-here.sh. `new-session -A` that attaches
# to an existing session returns before the hook, so only real creates fire.
set-hook -g after-new-session { if-shell -F "#{==:#{window_name},zsh}" { rename-window term } }

# --- Copy mode: vi keys (matches your nvim / zsh vi-mode) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
# 'y' to copy is provided by tmux-yank (-> pbcopy)
